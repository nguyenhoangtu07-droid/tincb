<script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz3TwRD48dNmASXNQkBR9OZhmsKe5NHrlv0CmHTpoW8YmjV6w3hsAMWnbl2qUT5ZOvr/exec";
        
        let quizData = [];
        let studentInfo = { username: '', name: '', quizId: '' };
        let isLoggedIn = false;
        let currentCategory = 'co-ban';

        const articles = {
            1: {
                title: "Khóa Học Tin Học Lấy Chứng Chỉ Ứng Dụng CNTT Cơ Bản & Nâng Cao",
                image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop",
                content: `<p>Chứng chỉ CNTT quốc gia phục vụ xét tốt nghiệp, thi tuyển công chức.</p>`
            },
            2: {
                title: "Thông Tin Đăng Ký Bản Quyền Gemini Pro & ChatGPT Plus",
                image: "https://images.unsplash.com/photo-1531482615713-2afd69097998?q=80&w=1200&auto=format&fit=crop",
                content: `<p>Nâng cấp tài khoản AI chính chủ phục vụ nghiên cứu và học tập.</p>`
            },
            3: {
                title: "Đào Tạo Tin Học Ứng Dụng Trí Tuệ Nhân Tạo (AI)",
                image: "https://images.unsplash.com/photo-1677442136019-21780ecad995?q=80&w=1200&auto=format&fit=crop",
                content: `<p>Khóa học ứng dụng ChatGPT, Gemini vào công việc văn phòng.</p>`
            }
        };

        function navigate(viewName) {
            const views = ['view-home', 'view-login', 'view-select', 'view-loading', 'view-quiz', 'view-result', 'view-review', 'view-article'];
            views.forEach(v => document.getElementById(v).classList.add('hidden-view'));
            document.getElementById(`view-${viewName}`).classList.remove('hidden-view');
            window.scrollTo(0, 0);

            if(viewName === 'home' && isLoggedIn) {
                document.getElementById('widget-login-text').innerHTML = `Xin chào <b>${studentInfo.name}</b>!<br>Bạn đã sẵn sàng luyện thi.`;
                document.getElementById('widget-login-btn').innerText = "Vào chọn đề thi";
            }
        }

        function showArticle(id) {
            const art = articles[id];
            if(art) {
                document.getElementById('article-title').innerText = art.title;
                document.getElementById('article-img').src = art.image;
                document.getElementById('article-content').innerHTML = art.content;
                navigate('article');
            }
        }

        function requireLoginForQuiz() {
            if (isLoggedIn) {
                selectCategory('co-ban');
                navigate('select');
            } else {
                navigate('login');
            }
        }

        async function loginUser() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            if (!user || !pass) {
                errorEl.innerText = "Vui lòng nhập đầy đủ thông tin!";
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Đang xác thực...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'login', username: user, password: pass })
                });
                const result = await response.json();

                if (result.status === "success") {
                    isLoggedIn = true;
                    studentInfo.username = user;
                    studentInfo.name = result.hoten; 
                    document.getElementById('student-name-display').innerText = result.hoten;
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    selectCategory('co-ban');
                    navigate('select');
                } else {
                    errorEl.innerText = result.message || "Tài khoản hoặc mật khẩu sai!";
                    errorEl.classList.remove('hidden');
                }
            } catch (error) {
                errorEl.innerText = "Lỗi kết nối máy chủ!";
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = "Đăng nhập hệ thống";
            }
        }

        // PHÂN LOẠI ĐỀ THI CƠ BẢN (35 ĐỀ) VÀ NÂNG CAO (10 ĐỀ)
        function selectCategory(category) {
            currentCategory = category;
            const btnCB = document.getElementById('btn-coban');
            const btnNC = document.getElementById('btn-nangcao');
            const grid = document.getElementById('quiz-buttons-grid');
            grid.innerHTML = '';

            if(category === 'co-ban') {
                btnCB.className = "p-4 border-2 border-blue-600 rounded-xl font-bold text-blue-600 hover:bg-blue-50 transition";
                btnNC.className = "p-4 border-2 border-gray-300 rounded-xl font-bold text-gray-700 hover:bg-gray-50 transition";
                
                // Tạo 35 nút đề cơ bản (Đề 1 đến Đề 35)
                for(let i = 1; i <= 35; i++) {
                    createQuizButton(grid, i, i);
                }
            } else {
                btnNC.className = "p-4 border-2 border-blue-600 rounded-xl font-bold text-blue-600 hover:bg-blue-50 transition";
                btnCB.className = "p-4 border-2 border-gray-300 rounded-xl font-bold text-gray-700 hover:bg-gray-50 transition";
                
                // Tạo 10 nút đề nâng cao (NC_de01 đến NC_de10)
                for(let i = 1; i <= 10; i++) {
                    let formattedNum = i < 10 ? `0${i}` : `${i}`;
                    let maDeCode = `NC_de${formattedNum}`;
                    createQuizButton(grid, `NC ${i}`, maDeCode);
                }
            }
            navigate('select');
        }

        function createQuizButton(parent, label, quizIdValue) {
            const btn = document.createElement('button');
            btn.className = "bg-gray-100 hover:bg-blue-600 hover:text-white border font-bold py-2.5 rounded-lg transition text-blue-900 text-sm";
            btn.innerText = `Đề ${label}`;
            btn.onclick = () => startQuiz(quizIdValue);
            parent.appendChild(btn);
        }

        async function startQuiz(quizId) {
            studentInfo.quizId = quizId;
            document.getElementById('loading-text').innerText = `Đang tải dữ liệu Đề số ${quizId}...`;
            navigate('loading');
            
            document.getElementById('display-name').innerText = studentInfo.name;
            document.getElementById('display-quiz').innerText = quizId;

            try {
                const response = await fetch(`${API_URL}?made=${quizId}`);
                quizData = await response.json();

                if(quizData.length === 0) {
                    alert(`Hiện chưa có câu hỏi cho mã đề ${quizId}.`);
                    navigate('select');
                    return;
                }

                renderQuestions();
                navigate('quiz');
            } catch (error) {
                alert("Lỗi tải đề thi.");
                navigate('select');
            }
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            quizData.forEach((q, index) => {
                const questionHTML = `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <div class="font-bold text-lg mb-4 text-gray-800 flex items-start">
                            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded text-sm mr-3">Câu ${index + 1}</span>
                            <span>${q.NoiDung}</span>
                        </div>
                        <div class="space-y-3 pl-2 md:pl-12">
                            ${['A', 'B', 'C', 'D'].map(option => {
                                const optionContent = q[`DapAn${option}`];
                                if(!optionContent) return '';
                                return `
                                <label class="flex items-start cursor-pointer hover:bg-blue-50 p-3 border rounded-lg transition">
                                    <input type="radio" name="q${index}" value="${option}" class="mt-1 mr-3 w-4 h-4 text-blue-600">
                                    <span class="font-bold mr-2">${option}.</span> 
                                    <span>${optionContent}</span>
                                </label>`;
                            }).join('')}
                        </div>
                    </div>`;
                container.innerHTML += questionHTML;
            });
        }

        async function submitQuiz() {
            let answered = 0;
            quizData.forEach((_, i) => { if(document.querySelector(`input[name="q${i}"]:checked`)) answered++; });
            
            if(answered < quizData.length) {
                if(!confirm(`Bạn mới làm ${answered}/${quizData.length} câu. Bạn có chắc chắn muốn nộp bài?`)) return;
            } else {
                if(!confirm("Xác nhận nộp bài thi?")) return;
            }

            let correctAnswers = 0;
            quizData.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected && selected.value.toUpperCase() === String(q.DapAnDung).toUpperCase().trim()) {
                    correctAnswers++;
                }
            });

            const score = (correctAnswers / quizData.length) * 10;
            const finalScore = parseFloat(score.toFixed(1));

            document.getElementById('score-display').innerText = finalScore;
            document.getElementById('correct-count').innerText = correctAnswers;
            document.getElementById('total-count').innerText = quizData.length;
            navigate('result');

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'submit',
                        hoc_vien: studentInfo.name,
                        ma_de: studentInfo.quizId,
                        diem_so: finalScore,
                        so_cau_dung: correctAnswers
                    })
                });
            } catch (error) {
                console.error("Lỗi lưu điểm:", error);
            }
        }

        function openReviewModal() {
            const container = document.getElementById('review-container');
            container.innerHTML = '';

            quizData.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const studentChoice = selected ? selected.value.toUpperCase() : '';
                const correctChoice = String(q.DapAnDung).toUpperCase().trim();
                const isCorrect = studentChoice === correctChoice;

                let optionsHTML = '';
                ['A', 'B', 'C', 'D'].forEach(option => {
                    const content = q[`DapAn${option}`];
                    if(!content) return;

                    let style = "p-3 border rounded-lg mb-2 flex items-start ";
                    let badge = "";

                    if (option === correctChoice) {
                        style += "bg-green-100 border-green-400 text-green-900 font-bold";
                        badge = " <span class='ml-auto text-xs bg-green-600 text-white px-2 py-1 rounded'>Đáp án đúng</span>";
                    } else if (option === studentChoice && !isCorrect) {
                        style += "bg-red-100 border-red-400 text-red-900 font-bold";
                        badge = " <span class='ml-auto text-xs bg-red-600 text-white px-2 py-1 rounded'>Bạn chọn sai</span>";
                    } else {
                        style += "bg-white border-gray-100 text-gray-700";
                    }

                    optionsHTML += `<div class="${style}"><span class="w-6 font-bold">${option}.</span> <span class="flex-grow">${content}</span> ${badge}</div>`;
                });

                const statusBadge = isCorrect 
                    ? '<span class="bg-green-100 text-green-700 px-3 py-1 rounded text-sm font-bold"><i class="fas fa-check mr-1"></i> Đúng</span>'
                    : '<span class="bg-red-100 text-red-700 px-3 py-1 rounded text-sm font-bold"><i class="fas fa-times mr-1"></i> Sai / Chưa làm</span>';

                const card = `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded text-sm font-bold">Câu ${index + 1}</span>
                            ${statusBadge}
                        </div>
                        <div class="font-medium text-lg mb-4 text-gray-800">${q.NoiDung}</div>
                        <div class="space-y-2 pl-2 md:pl-6">${optionsHTML}</div>
                    </div>`;
                container.innerHTML += card;
            });

            navigate('review');
        }
    </script>
